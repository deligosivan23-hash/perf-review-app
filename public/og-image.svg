<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1C1917"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#78716C" opacity="0.2"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Logo mark -->
  <rect x="80" y="60" width="52" height="52" rx="14" fill="#B45309"/>
  <line x1="96" y1="76" x2="116" y2="76" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="86" x2="110" y2="86" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="96" x2="113" y2="96" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="106" x2="107" y2="106" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="148" y="97" font-family="Georgia, serif" font-size="36" font-weight="700" fill="white" letter-spacing="-1">ReviewAI</text>

  <!-- Badge -->
  <rect x="80" y="170" width="160" height="32" rx="16" fill="#B45309" fill-opacity="0.2" stroke="#D97706" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="104" cy="186" r="5" fill="#D97706"/>
  <text x="118" y="191" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FCD34D" letter-spacing="2">FREE AI TOOL</text>

  <!-- Headline -->
  <text x="80" y="290" font-family="Georgia, serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">Performance Reviews,</text>
  <text x="80" y="375" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#D97706" letter-spacing="-2">Written by AI.</text>

  <!-- Subtext -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="26" fill="#78716C" font-weight="300">Structured, HR-ready reviews built from your notes</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="26" fill="#78716C" font-weight="300">in under 30 seconds. Free. No signup required.</text>

  <!-- Trust badges -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="20" fill="#B45309" font-weight="700">✓</text>
  <text x="104" y="560" font-family="Arial, sans-serif" font-size="20" fill="#57534E">No signup</text>

  <text x="270" y="560" font-family="Arial, sans-serif" font-size="20" fill="#B45309" font-weight="700">✓</text>
  <text x="294" y="560" font-family="Arial, sans-serif" font-size="20" fill="#57534E">No data stored</text>

  <text x="500" y="560" font-family="Arial, sans-serif" font-size="20" fill="#B45309" font-weight="700">✓</text>
  <text x="524" y="560" font-family="Arial, sans-serif" font-size="20" fill="#57534E">10 role types</text>

  <!-- URL -->
  <text x="1120" y="560" font-family="Arial, sans-serif" font-size="18" fill="#44403C" text-anchor="end">perf-review-app.vercel.app</text>
</svg>